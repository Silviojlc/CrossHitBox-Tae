<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossHitBox Tae — Inscrição</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <h1 class="text-2xl font-bold text-amber-400 text-center">CROSSHITBOX TAE</h1>
    <p id="subtituloPreco" class="text-xs text-slate-400 text-center mt-1">Turnos 05:00 e 18:00 • A carregar preço...</p>

    <form id="inscricaoForm" class="space-y-4 mt-6">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome Completo</label>
        <input id="nome" type="text" required class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">E-mail</label>
        <input id="email" type="email" required class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Telefone / Telemóvel</label>
        <input id="telefone" type="text" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Turno / Horário</label>
        <select id="horario" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white">
          <option value="05:00 - Madrugada">05:00 — Madrugada</option>
          <option value="18:00 - Tarde">18:00 — Tarde</option>
        </select>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold transition">
        Confirmar Inscrição
      </button>
    </form>

    <div id="resultadoBox" class="hidden mt-4 p-4 rounded-xl bg-emerald-950/70 border border-emerald-500/40 text-xs space-y-1">
      <p class="font-bold text-emerald-300">Inscrição concluída com sucesso.</p>
      <p id="resPreco"></p>
      <p id="resSenha"></p>
      <p class="text-slate-300 pt-1">Use o seu e-mail e a password temporária na Área do Atleta para preencher a sua ficha de treino e aceder às aulas.</p>
    </div>

    <p id="erroBox" class="hidden mt-3 text-xs text-rose-400 text-center"></p>

    <div class="mt-5 pt-4 border-t border-slate-800 flex items-center justify-between text-xs">
      <a href="/membro.html" class="text-emerald-400 hover:text-emerald-300 underline">Área do Atleta</a>
      <a href="/admin.html" class="text-slate-400 hover:text-amber-400 underline">Administração</a>
    </div>
  </div>

  <script>
    async function carregarPrecoInicial() {
      try {
        const res = await fetch('/api/crosshitbox/preco');
        const data = await res.json();
        if (data.success) {
          document.getElementById('subtituloPreco').textContent = `Turnos 05:00 e 18:00 • Valor atual: ${data.preco} ECV`;
        }
      } catch {}
    }

    document.getElementById('inscricaoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('erroBox').classList.add('hidden');
      document.getElementById('resultadoBox').classList.add('hidden');

      const res = await fetch('/api/crosshitbox/registar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('nome').value.trim(),
          email: document.getElementById('email').value.trim(),
          telefone: document.getElementById('telefone').value.trim(),
          horario: document.getElementById('horario').value
        })
      });
      const data = await res.json();

      if (!data.success) {
        const err = document.getElementById('erroBox');
        err.textContent = data.error || 'Erro ao registar inscrição.';
        err.classList.remove('hidden');
        return;
      }

      document.getElementById('resPreco').innerHTML = `Preço aplicado: <strong>${data.precoAplicado} ECV</strong>`;
      document.getElementById('resSenha').innerHTML = `Password temporária: <code class="px-1.5 py-0.5 rounded bg-slate-950 text-amber-300">${data.passwordTemporaria}</code>`;
      document.getElementById('resultadoBox').classList.remove('hidden');
      e.target.reset();
    });

    carregarPrecoInicial();
  </script>
  <script src="/pwa-init.js"></script>
  <script src="/fundo-tema.js"></script>
</body>
</html>
